document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

le=\"margin-left:-4px\">3<\u002Fspan><span style=\"margin-left:-4px\">4<\u002Fspan><span style=\"margin-left:-4px\">5<\u002Fspan><span style=\"margin-left:-4px\">6<\u002Fspan><span style=\"margin-left:-4px\">7<\u002Fspan><span style=\"margin-left:-4px\">8<\u002Fspan><span style=\"margin-left:-4px\">9<\u002Fspan><span style=\"margin-left:-6px; white-space:nowrap\">10 Jahre<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"position: absolute; left: 124px; top: 555px; white-space: nowrap; font: 500 12px/1.3 'Manrope', sans-serif; color: #8A93AD\">Ausgangsniveau<\u002Fdiv>\n\n  <!-- Kurven-Labels -->\n  \n  \n  <sc-if value=\"{{ showInsolvenz }}\" hint-placeholder-val=\"{{ true }}\">\n  \n  \n  \n  <\u002Fsc-if>\n  \n\n  <!-- Punkt-Labels -->\n  <sc-if value=\"{{ showWeichen }}\" hint-placeholder-val=\"{{ true }}\">\n  \n  \n  \n  <\u002Fsc-if>\n  <div data-anim=\"stationsBoot\" data-on=\"{{ on.stationsBoot }}\" data-delay=\"1\" style=\"position: absolute; left: 219px; top: 410px; white-space: nowrap; font: 600 12px/1.3 'Manrope', sans-serif; color: #2F5BFF\">Reality Check<\u002Fdiv>\n  \n  \n  \n  <div data-anim=\"stationsBoot\" data-on=\"{{ on.stationsBoot }}\" data-delay=\"5\" style=\"position: absolute; left: 739px; top: 566px; white-space: nowrap; font: 600 12px/1.3 'Manrope', sans-serif; color: #2F5BFF\">ScaleUp<\u002Fdiv><div data-anim=\"stationsBoot\" data-on=\"{{ on.stationsBoot }}\" data-delay=\"5\" style=\"position: absolute; left: 971px; top: 491px; white-space: nowrap; font: 600 12px/1.3 'Manrope', sans-serif; color: #2F5BFF\">ScaleUp<\u002Fdiv><div data-anim=\"stationsBoot\" data-on=\"{{ on.stationsBoot }}\" data-delay=\"5\" style=\"position: absolute; left: 1187px; top: 479px; white-space: nowrap; font: 600 12px/1.3 'Manrope', sans-serif; color: #2F5BFF\">ScaleUp<\u002Fdiv>\n  \n  \n  \n  <sc-if value=\"{{ showWeichen }}\" hint-placeholder-val=\"{{ true }}\">\n  <sc-if value=\"{{ showInsolvenz }}\" hint-placeholder-val=\"{{ true }}\">\n  <div data-anim=\"weichenVc\" data-on=\"{{ on.weichenVc }}\" data-delay=\"4\" style=\"position: absolute; left: 684px; top: 716px; white-space: nowrap; font: 600 12px/1.3 'Manrope', sans-serif; color: #C91414\">Insolvenz<\u002Fdiv>\n  <div data-anim=\"recoveryVc\" data-on=\"{{ on.recoveryVc }}\" data-delay=\"4\" style=\"position: absolute; left: 761px; top: 714px; white-space: nowrap; font: 600 12px/1.3 'Manrope', sans-serif; color: #0A8F69\">Reset<\u002Fdiv><div data-anim=\"recoveryVc\" data-on=\"{{ on.recoveryVc }}\" data-delay=\"6\" style=\"position: absolute; left: 1013px; top: 714px; white-space: nowrap; font: 600 12px/1.3 'Manrope', sans-serif; color: #0A8F69\">Reset<\u002Fdiv>\n  <\u002Fsc-if>\n  <div data-anim=\"weichenVc\" data-on=\"{{ on.weichenVc }}\" data-delay=\"3\" style=\"position: absolute; left: 598px; top: 475px; white-space: nowrap; font: 600 12px/1.3 'Manrope', sans-serif; color: #0B1733\">Mayday<\u002Fdiv>\n  \n  <div data-anim=\"stationsVc\" data-on=\"{{ on.stationsVc }}\" data-delay=\"7\" style=\"position: absolute; left: 1080px; top: 38px; white-space: nowrap; font: 600 12px/1.3 'Manrope', sans-serif; color: #0B1733\">Endgame<br>Exit oder Insolvenz<\u002Fdiv>\n  \n  <\u002Fsc-if>\n\n  <!-- Kopf -->\n  <div style=\"position: absolute; left: 54px; top: {{ headerTop }}px; width: 1100px; display: flex; flex-direction: column; gap: 8px\">\n    <img src=\"48a827a2-04af-43eb-9898-fbe7fbe3487e\" alt=\"Gründer-Mentor.de\" style=\"height:34px; width:auto; display:block; align-self:flex-start\">\n    <sc-if value=\"{{ showTitle }}\" hint-placeholder-val=\"{{ true }}\">\n    <h1 style=\"margin:0; font:800 36px/1 'Manrope', sans-serif; letter-spacing:-0.01em; color:#0B1733\">Streckenüberblick der Gründer-Achterbahn<\u002Fh1>\n    <\u002Fsc-if>\n    <div style=\"white-space:nowrap; font:500 11px/1 'Manrope', sans-serif; letter-spacing:0.04em; color:#8A93AD\">© 2026 Gründer-Mentor.de · Alle Rechte vorbehalten<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Wasserzeichen -->\n  <div style=\"position:absolute; left:50%; top:430px; translate:-50% 0; white-space:nowrap; font:800 96px/1 'Manrope', sans-serif; letter-spacing:-0.02em; color:rgba(11,23,51,0.045); pointer-events:none; user-select:none; z-index:0\">Gründer-Mentor.de<\u002Fdiv>\n\n  <!-- Stationen kompakt -->\n  <sc-if value=\"{{ showCards }}\" hint-placeholder-val=\"{{ true }}\">\n  <div data-anim=\"stationsBoot\" data-on=\"{{ on.stationsBoot }}\" data-delay=\"late\" style=\"position:absolute; left:78px; top:800px; width:1444px; display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px\">\n    <div style=\"box-sizing:border-box; padding:12px 14px; background:#FFFFFF; border:1px solid rgba(11,23,51,0.1); border-radius:12px; display:flex; flex-direction:column; gap:6px\">\n      <div style=\"display:flex; align-items:center; gap:10px\">\n        <span style=\"display:flex; align-items:center; gap:4px; flex:none\"><span style=\"width:22px; height:22px; border-radius:50%; background:#2F5BFF; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font:800 12px/1 'Manrope', sans-serif; letter-spacing:-0.02em; flex:none\">1<\u002Fspan><\u002Fspan>\n        <span style=\"font:800 16px/1.1 'Manrope', sans-serif; color:#0B1733; flex:1\">Reality Check<\u002Fspan>\n        <span style=\"font:600 11px/1 'Manrope', sans-serif; color:#0B1733; background:rgba(11,23,51,0.06); padding:5px 8px; border-radius:999px; white-space:nowrap\">4–6 Wochen<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font:400 13px/1.35 'Manrope', sans-serif; color:#5B6686\">Kenne die Spielregeln, bevor du spielst – auch Nein ist okay. Manchmal muss man es aber einfach probieren.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"box-sizing:border-box; padding:12px 14px; background:#FFFFFF; border:1px solid rgba(11,23,51,0.1); border-radius:12px; display:flex; flex-direction:column; gap:6px\">\n      <div style=\"display:flex; align-items:center; gap:10px\">\n        <span style=\"display:flex; align-items:center; gap:4px; flex:none\"><span style=\"width:22px; height:22px; border-radius:50%; background:#2F5BFF; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font:800 12px/1 'Manrope', sans-serif; letter-spacing:-0.02em; flex:none\">2<\u002Fspan><span style=\"width:22px; height:22px; border-radius:50%; background:#8A93AD; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font:800 12px/1 'Manrope', sans-serif; letter-spacing:-0.02em; flex:none\">2<\u002Fspan><\u002Fspan>\n        <span style=\"font:800 16px/1.1 'Manrope', sans-serif; color:#0B1733; flex:1\">Start from Zero<\u002Fspan>\n        <span style=\"font:600 11px/1 'Manrope', sans-serif; color:#0B1733; background:rgba(11,23,51,0.06); padding:5px 8px; border-radius:999px; white-space:nowrap\">6 Monate<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font:400 13px/1.35 'Manrope', sans-serif; color:#5B6686\">Von der Ideenfindung zum ersten zahlenden Kunden – auch als Neustart nach Reset.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"box-sizing:border-box; padding:12px 14px; background:#FFFFFF; border:1px solid rgba(11,23,51,0.1); border-radius:12px; display:flex; flex-direction:column; gap:6px\">\n      <div style=\"display:flex; align-items:center; gap:10px\">\n        <span style=\"display:flex; align-items:center; gap:4px; flex:none\"><span style=\"width:22px; height:22px; border-radius:50%; background:#2F5BFF; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font:800 12px/1 'Manrope', sans-serif; letter-spacing:-0.02em; flex:none\">3<\u002Fspan><\u002Fspan>\n        <span style=\"font:800 16px/1.1 'Manrope', sans-serif; color:#0B1733; flex:1\">Traction<\u002Fspan>\n        <span style=\"font:600 11px/1 'Manrope', sans-serif; color:#0B1733; background:rgba(11,23,51,0.06); padding:5px 8px; border-radius:999px; white-space:nowrap\">12 Monate<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font:400 13px/1.35 'Manrope', sans-serif; color:#5B6686\">Umsatz, der wiederkommt und planbar wird – und welcher Finanzierungs-Track wirklich passt.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"box-sizing:border-box; padding:12px 14px; background:#FFFFFF; border:1px solid rgba(11,23,51,0.1); border-radius:12px; display:flex; flex-direction:column; gap:6px\">\n      <div style=\"display:flex; align-items:center; gap:10px\">\n        <span style=\"display:flex; align-items:center; gap:4px; flex:none\"><span style=\"width:22px; height:22px; border-radius:50%; background:#2F5BFF; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font:800 9px/1 'Manrope', sans-serif; letter-spacing:-0.02em; flex:none\">4.1<\u002Fspan><span style=\"width:22px; height:22px; border-radius:50%; background:#2F5BFF; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font:800 9px/1 'Manrope', sans-serif; letter-spacing:-0.02em; flex:none\">4.2<\u002Fspan><span style=\"width:22px; height:22px; border-radius:50%; background:#2F5BFF; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font:800 9px/1 'Manrope', sans-serif; letter-spacing:-0.02em; flex:none\">4.3<\u002Fspan><span style=\"width:22px; height:22px; border-radius:50%; background:#0B1733; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font:800 9px/1 'Manrope', sans-serif; letter-spacing:-0.02em; flex:none\">4.1<\u002Fspan><span style=\"width:22px; height:22px; border-radius:50%; background:#0B1733; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font:800 9px/1 'Manrope', sans-serif; letter-spacing:-0.02em; flex:none\">4.2<\u002Fspan><span style=\"width:22px; height:22px; border-radius:50%; background:#0B1733; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font:800 9px/1 'Manrope', sans-serif; letter-spacing:-0.02em; flex:none\">4.3<\u002Fspan><\u002Fspan>\n        <span style=\"font:800 16px/1.1 'Manrope', sans-serif; color:#0B1733; flex:1\">ScaleUp<\u002Fspan>\n        <span style=\"font:600 11px/1 'Manrope', sans-serif; color:#0B1733; background:rgba(11,23,51,0.06); padding:5px 8px; border-radius:999px; white-space:nowrap\">9–24 Monate<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font:400 13px/1.35 'Manrope', sans-serif; color:#5B6686\">Unternehmen skalieren in drei Phasen (Sales, Produkt, Organisation) – bootstrapped oder mit VC.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Weichen & Raise kompakt -->\n  <div data-anim=\"weichenBoot\" data-on=\"{{ on.weichenBoot }}\" data-delay=\"late\" style=\"position:absolute; left:78px; top:904px; width:1444px; display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px\">\n    \n    <div data-anim=\"stationsVc\" data-on=\"{{ on.stationsVc }}\" data-delay=\"late\" style=\"box-sizing:border-box; padding:12px 14px; background:#FFFFFF; border:1px solid rgba(11,23,51,0.1); border-radius:12px; display:flex; flex-direction:column; gap:6px\">\n      <div style=\"display:flex; align-items:center; gap:10px\">\n        <span style=\"display:flex; align-items:center; gap:4px; flex:none\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 26 26\" style=\"flex:none\"><path d=\"M13 2 L24 13 L13 24 L2 13 Z\" fill=\"#FFFFFF\" stroke=\"#0B1733\" style=\"stroke-width:3.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span style=\"font:800 16px/1.1 'Manrope', sans-serif; color:#0B1733; flex:1\">Raise<\u002Fspan>\n        <span style=\"font:600 11px/1 'Manrope', sans-serif; color:#0B1733; background:rgba(11,23,51,0.06); padding:5px 8px; border-radius:999px; white-space:nowrap\">4–6 Monate · Runden-Takt<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font:400 13px/1.35 'Manrope', sans-serif; color:#5B6686\">Die 1. VC-Runde ist die Weichenstellung: Folgerunden bis zum Exit – oder Insolvenz. Kein Zurück.<\u002Fdiv>\n    <\u002Fdiv><sc-if value=\"{{ showWeichen }}\" hint-placeholder-val=\"{{ true }}\">\n    \n    \n    <div style=\"box-sizing:border-box; padding:12px 14px; background:#FFFFFF; border:1px solid rgba(11,23,51,0.1); border-radius:12px; display:flex; flex-direction:column; gap:6px\">\n      <div style=\"display:flex; align-items:center; gap:10px\">\n        <span style=\"display:flex; align-items:center; gap:4px; flex:none\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 26 26\" style=\"flex:none\"><path d=\"M13 2 L24 13 L13 24 L2 13 Z\" fill=\"#FFFFFF\" stroke=\"#2F5BFF\" style=\"stroke-width:3.5\"><\u002Fpath><\u002Fsvg><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 26 26\" style=\"flex:none\"><path d=\"M13 2 L24 13 L13 24 L2 13 Z\" fill=\"#FFFFFF\" stroke=\"#0B1733\" style=\"stroke-width:3.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span style=\"font:800 16px/1.1 'Manrope', sans-serif; color:#0B1733; flex:1\">Mayday<\u002Fspan>\n        <span style=\"font:600 11px/1 'Manrope', sans-serif; color:#0B1733; background:rgba(11,23,51,0.06); padding:5px 8px; border-radius:999px; white-space:nowrap\">6–12 Wochen · Einstieg jederzeit<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font:400 13px/1.35 'Manrope', sans-serif; color:#5B6686\">Wenn der Runway knapp wird und du im Krisenmodus bist – bootstrapped (blau) oder mit VC (schwarz).<\u002Fdiv>\n    <\u002Fdiv><div style=\"box-sizing:border-box; padding:12px 14px; background:#FFFFFF; border:1px solid rgba(11,23,51,0.1); border-radius:12px; display:flex; flex-direction:column; gap:6px\">\n      <div style=\"display:flex; align-items:center; gap:10px\">\n        <span style=\"display:flex; align-items:center; gap:4px; flex:none\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 26 26\" style=\"flex:none\"><path d=\"M13 2 L24 13 L13 24 L2 13 Z\" fill=\"#FFFFFF\" stroke=\"#2F5BFF\" style=\"stroke-width:3.5\"><\u002Fpath><\u002Fsvg><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 26 26\" style=\"flex:none\"><path d=\"M13 2 L24 13 L13 24 L2 13 Z\" fill=\"#FFFFFF\" stroke=\"#0B1733\" style=\"stroke-width:3.5\"><\u002Fpath><\u002Fsvg><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 26 26\" style=\"flex:none\"><path d=\"M13 2 L24 13 L13 24 L2 13 Z\" fill=\"#FFFFFF\" stroke=\"#C91414\" style=\"stroke-width:3.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span style=\"font: 800 16px/1.1 'Manrope', sans-serif; color: #0B1733; flex: 1; width: 163px; height: 16px\">Endgame<\u002Fspan>\n        <span style=\"font:600 11px/1 'Manrope', sans-serif; color:#0B1733; background:rgba(11,23,51,0.06); padding:5px 8px; border-radius:999px; white-space:nowrap\">6–12 Monate<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font:400 13px/1.35 'Manrope', sans-serif; color:#5B6686\">Das Ende gestalten statt erleiden: Exit oder Abwicklung in der Insolvenz (b.c. ohne Privathaftung)<\u002Fdiv>\n    <\u002Fdiv><div data-anim=\"recoveryVc\" data-on=\"{{ on.recoveryVc }}\" data-delay=\"late\" style=\"box-sizing:border-box; padding:12px 14px; background:#FFFFFF; border:1px solid rgba(11,23,51,0.1); border-radius:12px; display:flex; flex-direction:column; gap:6px\">\n      <div style=\"display:flex; align-items:center; gap:10px\">\n        <span style=\"display:flex; align-items:center; gap:4px; flex:none\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 26 26\" style=\"flex:none\"><path d=\"M13 2 L24 13 L13 24 L2 13 Z\" fill=\"#FFFFFF\" stroke=\"#10D199\" style=\"stroke-width:3.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span style=\"font:800 16px/1.1 'Manrope', sans-serif; color:#0B1733; flex:1\">Reset<\u002Fspan>\n        <span style=\"font:600 11px/1 'Manrope', sans-serif; color:#0B1733; background:rgba(11,23,51,0.06); padding:5px 8px; border-radius:999px; white-space:nowrap\">3-6 Monate + optional Retreat<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font:400 13px/1.35 'Manrope', sans-serif; color:#5B6686\">Wer du bist ohne die Firma. Kopf &amp; Körper sortiert – und wieder Start from Zero. Oder was anderes.<\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <\u002Fdiv>\n  \n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:1050},&quot;showInsolvenz&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Kurven&quot;},&quot;showWeichen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Kurven&quot;},&quot;showCards&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Inhalt&quot;},&quot;showTitle&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Inhalt&quot;},&quot;showHoverCards&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Inhalt&quot;},&quot;showHandles&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Bearbeiten&quot;},&quot;presentMode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Präsentation&quot;},&quot;presentStep&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:8,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Präsentation&quot;},&quot;showControls&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Präsentation&quot;}}\">\nclass Component extends DCLogic {\n  // Startform – wird überschrieben, sobald die Griffe (data-handle) im Editing sichtbar sind\n  static DEFAULTS = {\"trunk\":[[120,540],[150,540],[196,420],[238,500],[286,640],[330,648],[362,658],[396,640],[479,594]],\"boot\":[[479,594],[600,580],[690,606],[800,575],[900,602],[1050,575],[1250,470],[1500,370]],\"vc\":[[479,594],[570,470],[640,545],[670,575],[850,300],[940,360],[1000,220],[1050,290],[1130,150]],\"retIns\":[[720,700],[787,705],[822,640],[845,540]],\"ins\":[[670,575],[735,650],[760,700]],\"retIns\":[[830,700],[877,627],[905,540]],\"retExit2\":[[1330,700],[1375,705],[1402,630],[1420,540]],\"postExit\":[[1216,58],[1290,70],[1350,250],[1395,520],[1426,696]],\"retExit\":[[1130,150],[1187,262],[1210,540]],\"retBoot\":[[1290,448],[1332,465],[1370,540]],\"ins3\":[[1066,214],[1110,330],[1150,560],[1180,700]],\"retIns3\":[[1180,700],[1225,705],[1252,630],[1270,540]],\"retInsLate\":[[946,690],[1000,690],[1060,600],[1085,540]],\"insLate\":[[931,363],[976,405],[999,470],[1010,540]]};\n  static GROUPS = ['curveBoot', 'stationsBoot', 'weichenBoot', 'curveVc', 'stationsVc', 'weichenVc', 'recoveryVc', 'postExit'];\n  static GROUP_NAMES = { curveBoot: 'Kurve Bootstrapped', stationsBoot: 'Stationen Bootstrapped', weichenBoot: 'Weichen Bootstrapped', curveVc: 'Kurve VC', stationsVc: 'Stationen VC', weichenVc: 'Weichen VC · bis Insolvenz', recoveryVc: 'Reset → Start from Zero', postExit: 'Post-Exit' };\n  static UI_KEY = 'gm-achterbahn-ui';\n  static UI_DEFAULTS = { showTitle: true, showCards: true, showWeichen: true, showInsolvenz: true, presentMode: false };\n  state = { curves: JSON.parse(JSON.stringify(Component.DEFAULTS)), editing: false, step: null, ui: {} };\n  val(k) { return this.state.ui[k] ?? this.props[k] ?? Component.UI_DEFAULTS[k]; }\n  toggle(k) { this.setState(st => { const ui = { ...st.ui, [k]: !this.val(k) }; try { localStorage.setItem(Component.UI_KEY, JSON.stringify(ui)); } catch (e) {} return { ui }; }); }\n  componentDidUpdate(prev) {\n    // Tweak geändert → gespeicherte In-Page-Werte für diesen Schlüssel verwerfen, damit der Tweak greift\n    if (prev) for (const k of Object.keys(Component.UI_DEFAULTS)) if (prev[k] !== this.props[k] && this.state.ui[k] !== undefined) {\n      this.setState(st => { const ui = { ...st.ui }; delete ui[k]; try { localStorage.setItem(Component.UI_KEY, JSON.stringify(ui)); } catch (e) {} return { ui }; }); break;\n    }\n    if (prev && prev.presentStep !== this.props.presentStep && this.state.step !== null) this.setState({ step: null });\n    this.schedule();\n  }\n  stepTo(n) { this.setState({ step: Math.max(0, Math.min(Component.GROUPS.length, n)) }); }\n  curStep() { return this.state.step ?? Math.max(0, Math.min(Component.GROUPS.length, this.props.presentStep ?? Component.GROUPS.length)); }\n  rootRef = React.createRef();\n  componentDidMount() {\n    this._key = (e) => {\n      const t = e.target; if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;\n      if ((e.key === 'e' || e.key === 'E') && !e.metaKey && !e.ctrlKey && !e.altKey) this.setState(st => ({ editing: !st.editing }));\n      if ((e.key === 't' || e.key === 'T') && !e.metaKey && !e.ctrlKey && !e.altKey) this.setState(st => ({ controls: !(st.controls ?? (this.props.showControls ?? false)) }));\n      if (this.val('presentMode')) {\n        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); this.stepTo(this.curStep() + 1); }\n        if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); this.stepTo(this.curStep() - 1); }\n        if (e.key === 'Home') this.stepTo(0);\n        if (e.key === 'End') this.stepTo(Component.GROUPS.length);\n      }\n    };\n    window.addEventListener('keydown', this._key);\n    try { const ui = JSON.parse(localStorage.getItem(Component.UI_KEY) || 'null'); if (ui && typeof ui === 'object') { for (const k in ui) if (this.props[k] !== undefined) delete ui[k]; this.setState({ ui }); } } catch (e) {}\n    // Embed-URL: ?present=1&step=0&title=0&cards=1&weichen=1&insolvenz=1&controls=1\n    try {\n      const q = new URLSearchParams(location.search);\n      const b = (v) => v === '1' || v === 'true' || v === 'ja';\n      const map = { present: 'presentMode', title: 'showTitle', cards: 'showCards', weichen: 'showWeichen', insolvenz: 'showInsolvenz' };\n      const ui = {}; let any = false;\n      for (const k in map) if (q.has(k)) { ui[map[k]] = b(q.get(k)); any = true; }\n      const patch = {};\n      if (any) patch.ui = ui;\n      if (q.has('step')) patch.step = Math.max(0, Math.min(Component.GROUPS.length, parseInt(q.get('step'), 10) || 0));\n      if (q.has('controls')) patch.controls = b(q.get('controls'));\n      if (Object.keys(patch).length) this.setState(patch);\n    } catch (e) {}\n    // Klick (ohne Verschieben) auf Station/Weiche hält die Karte offen – zum Texten im Editor\n    this._pd = (e) => { const m = e.target.closest && e.target.closest('[data-marker]'); this._press = m && !e.target.closest('[data-card]') ? { m, x: e.clientX, y: e.clientY } : null; };\n    this._pu = (e) => {\n      const pr = this._press; this._press = null;\n      const inCard = e.target.closest && e.target.closest('[data-card]');\n      if (inCard) return;\n      if (pr && Math.hypot(e.clientX - pr.x, e.clientY - pr.y) < 4) {\n        const was = pr.m.getAttribute('data-pinned') === '1';\n        document.querySelectorAll('[data-marker][data-pinned=\"1\"]').forEach(el => el.removeAttribute('data-pinned'));\n        if (!was) pr.m.setAttribute('data-pinned', '1');\n      } else if (!pr && !(e.target.closest && e.target.closest('[data-marker]'))) {\n        document.querySelectorAll('[data-marker][data-pinned=\"1\"]').forEach(el => el.removeAttribute('data-pinned'));\n      }\n    };\n    document.addEventListener('pointerdown', this._pd, true);\n    document.addEventListener('pointerup', this._pu, true);\n    // Griffe beobachten: der Editor verschiebt/dupliziert/löscht sie, wir lesen die Positionen aus\n    this._obs = new MutationObserver(() => this.schedule());\n    if (this.rootRef.current) this._obs.observe(this.rootRef.current, { subtree: true, childList: true, attributes Title');\n    const showControls = this.state.controls ?? (this.props.showControls ?? false);\n    const pill = (onv) => onv ? { bg: '#0B1733', fg: '#FFFFFF' } : { bg: '#FFFFFF', fg: '#0B1733' };\n    const showHandles = (this.props.showHandles ?? false) || this.state.editing;\n    const c = this.state.curves;\n    const presentMode = this.val('presentMode');\n    const step = this.curStep();\n    const on = {};\n    Component.GROUPS.forEach((g, i) => { on[g] = presentMode ? (i < step ? '1' : '0') : '2'; });\n    const stepLabel = step === 0 ? 'START · 0/' + Component.GROUPS.length : 'SCHRITT ' + step + '/' + Component.GROUPS.length + ' · ' + Component.GROUP_NAMES[Component.GROUPS[step - 1]].toUpperCase();\n    const b = c.boot, a = b[b.length - 2], z = b[b.length - 1];\n    const arrowRotate = Math.round(Math.atan2(z[1] - a[1], z[0] - a[0]) * 180 / Math.PI);\n    return {\n      arrowRotate,\n      showWeichen, showInsolvenz, showCards, showHandles,\n      weichenDisplay: showWeichen ? 'inline' : 'none',\n      insolvenzDisplay: showInsolvenz ? 'inline' : 'none',\n      rootRef: this.rootRef, editingAttr: showHandles ? '1' : '0',\n      presentMode, on, stepLabel, showTitle, headerTop: showTitle ? 27 : 69, showControls,\n      uiPresent: pill(presentMode), presentLabel: presentMode ? 'AN' : 'AUS',\n      tgPresent: () => this.toggle('presentMode'), hoverCardsAttr: (this.props.showHoverCards ?? false) ? '1' : '0', nextStep: () => this.stepTo(this.curStep() + 1), prevStep: () => this.stepTo(this.curStep() - 1),\n      dTrunk: this.path(c.trunk), dBoot: this.path(c.boot), dVc: this.path(c.vc), dIns: this.path(c.ins),\n      dRetIns: this.path(c.retIns), dRetExit: this.path(c.retExit), dPostExit: this.path(c.postExit), dRetExit2: this.path(c.retExit2), dRetBoot: this.path(c.retBoot), dInsLate: this.path(c.insLate), dRetInsLate: this.path(c.retInsLate), dIns3: this.path(c.ins3), dRetIns3: this.path(c.retIns3),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml
